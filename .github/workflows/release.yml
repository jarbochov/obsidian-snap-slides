name: Release Snap Slides

on:
  push:
    tags:
      - "*"  # Triggers workflow on any tag push

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint, typecheck, and build
        run: npm run verify

      - name: Run Obsidian community scanner
        uses: obsidianmd/obsidian-workflows@v1
        with:
          scanner-lint: true

      - name: Archive plugin files
        run: zip -j snap-slides-${{ github.ref_name }}.zip main.js manifest.json styles.css versions.json

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          draft: true
          files: |
            main.js
            manifest.json
            styles.css
            versions.json
            snap-slides-${{ github.ref_name }}.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}